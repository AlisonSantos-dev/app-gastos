spring:
  application:
    name: app-gastos-api

  # Lê as variáveis do arquivo .env da raiz do repositório
  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:appgastos}
    username: ${DB_USER:appgastos}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

# Integração com a Pluggy (Open Finance)
pluggy:
  base-url: https://api.pluggy.ai
  client-id: ${PLUGGY_CLIENT_ID:}
  client-secret: ${PLUGGY_CLIENT_SECRET:}
  # A API Key da Pluggy vale 2 horas. Renovamos um pouco antes, por segurança.
  api-key-duracao: 110m
  # Conexões com os bancos (uma por banco), separadas por vírgula no .env
  item-ids: ${PLUGGY_ITEM_IDS:}
